- name: setup user server
  hosts: user
  become: yes
  tasks: 
  - name: disable default nodejs
    ansible.builtin.commad: dnf disable nodejs -y
  
  - name: enable nodejs 20
    ansible.builtin.command: dnf module enable nodejs:20 -y
  
  - name: install nodejs
    ansible.builtin.package:
      name: nodejs
      state: started